<!--
  Custom favicons: generated from the site glyph artwork
-->

{% assign favicon_version = '20260515-3' %}

<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicons/favicon-32.png' | relative_url }}?v={{ favicon_version }}">
<link rel="icon" type="image/png" sizes="96x96" href="{{ '/assets/img/favicons/favicon-96.png' | relative_url }}?v={{ favicon_version }}">

<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}?v={{ favicon_version }}">
